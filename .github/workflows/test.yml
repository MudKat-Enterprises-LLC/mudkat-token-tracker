name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m py_compile tracker.py collector.py generic-ingest.py test_tracker.py
      - run: python -m unittest -v
      - run: node --check opencode-plugin.js
      - run: node -e "const fs=require('fs');const h=fs.readFileSync('dashboard.html','utf8');new Function(h.match(/<script>([\s\S]*?)<\/script>/)[1])"
      - run: systemd-analyze --user verify deploy/*.service deploy/*.timer
